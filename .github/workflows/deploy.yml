name: Deploy MkDocs

# Pages-activatie staat uit zolang de repo private is op een Free plan.
# Wanneer je publiek wil gaan (of GitHub Pro hebt), activeer Pages via
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ⚠️ Met versienummers, uit requirements.txt. Zonder pin haalt elke bouw binnen wat er die dag nieuw
      # staat, en MkDocs 2.0 schrapt het plugin-systeem waar de tweetaligheid op draait. Zie requirements.txt.
      - run: pip install -r requirements.txt
      # De gedeelde filmhook (mkdocs.yml → _appkit/tools/filmgenerator/films_hook.py) en de filmcontrole wonen in
      # adm-appkit, en die repo is privé: meelezen met het repo-geheim ADM_APPKIT_LEZEN (fine-grained token, enkel
      # adm-appkit, Contents: Read-only — NOTEER DE VERVALDATUM). Zonder deze stap vindt mkdocs de hook niet.
      - uses: actions/checkout@v4
        with:
          repository: ADM-Concept/adm-appkit
          token: ${{ secrets.ADM_APPKIT_LEZEN }}
          path: _appkit
          sparse-checkout: tools/filmgenerator
      # --strict maakt van een waarschuwing een fout. Zonder die vlag bouwt een gebroken interne link of een
      # ontbrekende pagina gewoon door: de deploy wordt groen en de handleiding krijgt een dode link. Dat kan
      # nu veilig, want de plugin-versies liggen vast — 26/08/2026 nagemeten: strict is hier groen.
      - run: mkdocs build --strict
      # Staat elke gepubliceerde film onder de H1 van zijn pagina, met een volledig VideoObject? Meet de GEBOUWDE site.
      # --min-paginas: 4 films × 2 talen = 8 handleidingrijen, PLUS 6 websiterijen (19/10/2026). check-films telt elke
      # gepubliceerde rij met een pagina, ook de websiteversies (2 films × nl/fr/en) — die wijzen naar dezelfde pagina en
      # meten daar de handleidingspeler opnieuw. Met 8 zou een verdwenen handleidingfilm dus niet meer opvallen; met 14 wel.
      # Gemeld aan adm-appkit: de websiterijen horen daar overgeslagen te worden (uitvoering == 'website'). Verhoog bij elke nieuwe film — de bodem vangt een uitslagtabel
      # die stil gekrompen is; daarom komt hij niet uit diezelfde tabel.
      - name: Films controleren (plaatsing + videogegevens)
        run: python3 _appkit/tools/filmgenerator/check-films.py --min-paginas=14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
