name: Deploy MkDocs

# Pages-activatie staat uit zolang de repo private is op een Free plan.
# Wanneer je publiek wil gaan (of GitHub Pro hebt), activeer Pages via
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ⚠️ Met versienummers, uit requirements.txt. Zonder pin haalt elke bouw binnen wat er die dag nieuw
      # staat, en MkDocs 2.0 schrapt het plugin-systeem waar de tweetaligheid op draait. Zie requirements.txt.
      - run: pip install -r requirements.txt
      # --strict maakt van een waarschuwing een fout. Zonder die vlag bouwt een gebroken interne link of een
      # ontbrekende pagina gewoon door: de deploy wordt groen en de handleiding krijgt een dode link. Dat kan
      # nu veilig, want de plugin-versies liggen vast — 26/08/2026 nagemeten: strict is hier groen.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
