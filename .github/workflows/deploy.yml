name: Deploy MkDocs

# Pages-activatie staat uit zolang de repo private is op een Free plan.
# Wanneer je publiek wil gaan (of GitHub Pro hebt), activeer Pages via
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ⚠️ Met versienummers, uit requirements.txt. Zonder pin haalt elke bouw binnen wat er die dag nieuw
      # staat, en MkDocs 2.0 schrapt het plugin-systeem waar de tweetaligheid op draait. Zie requirements.txt.
      - run: pip install -r requirements.txt
      # De gedeelde filmhook (mkdocs.yml → _appkit/tools/filmgenerator/films_hook.py) en de filmcontrole wonen in
      # adm-appkit, en die repo is privé: meelezen met het repo-geheim ADM_APPKIT_LEZEN (fine-grained token, enkel
      # adm-appkit, Contents: Read-only — NOTEER DE VERVALDATUM). Zonder deze stap vindt mkdocs de hook niet.
      - uses: actions/checkout@v4
        with:
          repository: ADM-Concept/adm-appkit
          token: ${{ secrets.ADM_APPKIT_LEZEN }}
          path: _appkit
          # tools/docs-site: de hook en de controle voor zoeken per taal (07/11/2026).
          sparse-checkout: |
            tools/filmgenerator
            tools/docs-site
      # --strict maakt van een waarschuwing een fout. Zonder die vlag bouwt een gebroken interne link of een
      # ontbrekende pagina gewoon door: de deploy wordt groen en de handleiding krijgt een dode link. Dat kan
      # nu veilig, want de plugin-versies liggen vast — 26/08/2026 nagemeten: strict is hier groen.
      - run: mkdocs build --strict
      # ⚠️ NA de bouw: zoekt elke taal enkel in haar eigen pagina's? De hook faalt luid bij alles wat hij ziet, maar niet
      # wanneer hij er niet is — haalt iemand hem uit mkdocs.yml, dan mengt het zoekvak stil weer NL en FR (zo stond het
      # live tot 07/11/2026). Deze meet de GEBOUWDE site en mag de uitrol TEGENHOUDEN.
      - name: Zoeken per taal controleren
        run: python3 _appkit/tools/docs-site/check-zoeken.py site
      # Staat elke gepubliceerde film onder de H1 van zijn pagina, met een volledig VideoObject? Meet de GEBOUWDE site.
      # --min-paginas: 6 handleidingfilms × 2 talen = 12. Sinds adm-appkit c9a7c48 (20/11/2026) telt check-films enkel de
      # handleidingrijen; de websiteversies (2 films × nl/fr/en) wijzen naar dezelfde pagina maar staan er niet op. Tot dan
      # telde hij ze mee en stond hier 18 (12 + 6): met 12 kwam toen een verdwenen handleidingfilm groen door (16 ≥ 12,
      # gemeten 20/11). Verhoog bij elke nieuwe handleidingfilm met 2 — de bodem vangt een uitslagtabel die stil gekrompen
      # is; daarom komt hij niet uit diezelfde tabel.
      # Staat elk beeld uit de bron ook als <img> in de gebouwde site? 19/10/2026 verdwenen alle schermafdrukken bij het
      # bouwen (selectolax 1.0.1, zie requirements.txt) terwijl alle stappen hieronder groen bleven.
      - name: Beelden controleren (bron tegen gebouwde site)
        run: python3 tools/check-beelden.py site
      - name: Films controleren (plaatsing + videogegevens)
        run: python3 _appkit/tools/filmgenerator/check-films.py --min-paginas=12
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
