extra:
  generator: false
  # De Bunny-library van Nimble (één per pakket). Geen geheim: het staat in elk publiek embed-adres.
  bunny_library: "781262"

nav:
  - Home: index.md
  # Eén overzicht van alle films; de LIJST maakt de films-hook uit tools/films-uitslag.json.
  - "Video's": videos.md
  # Wat op élk scherm hetzelfde werkt, onder één tabblad (17/09/2026, op vraag van Dominique). Lijsten
  # filteren en Werken met een fiche stonden elk als eigen tabblad in de bovenbalk — vier tabbladen voor
  # algemene uitleg, en geen plaats meer voor nieuwe hoofdthema's. Notities en Bijlagen stonden onder CRM,
  # maar gelden voor elk scherm met een journaal, ook projecten. Zelfde opzet als creditsoft-docs.
  # De bestanden zijn niet verplaatst: de adressen blijven gelijk, dus links vanuit de app werken nog.
  - Aan de slag:
    - Dashboard: getting-started/dashboard.md
    - Lijsten filteren: lijsten-filteren.md
    - Werken met een fiche: fiches.md
    - Notities: notities.md
    - Bijlagen: bijlagen.md
    - Klantenportaal: getting-started/customer-portal.md
    # Wat een klant nog kan bij een betaalachterstand of op alleen-lezen (EW-36, 11/10/2026): de indeling die Dominique
    # goedkeurde, in gewone taal. Geen scherm van de app, dus geen ?-knop die hierheen wijst: de band bovenaan is de ingang.
    - Wanneer uw account beperkt is: getting-started/account-restricted.md
    - Tweestapsverificatie en passkeys: getting-started/tweestapsverificatie.md
  - CRM:
    - Leads: crm/leads.md
    - Leads vanaf uw website: crm/leads-webformulier.md
    - Relaties: relations.md
    - Contactpersonen: crm/contactpersonen.md
    - Taken: crm/tasks.md
  - Verkoop:
    - Offertes: sales/quotes.md
    - Prijsafspraken: sales/price-agreements.md
    - Orderboek: sales/order-book.md
    - Facturen: sales/invoices.md
    - Vorderingsstaten: sales/progress-reports.md
    - Aanmaningen: sales/reminders.md
    # Bankverrichtingen en Afpunten staan in de app onder Verkoop, dus hier ook (17/09/2026). Tot dan
    # hadden ze een eigen tabblad Financieel dat het app-menu niet kent.
    - Bankverrichtingen: finance/bank.md
    - Afpunten: finance/reconciliation.md
  # Volgorde van het app-menu (NimbleNav.cs): Bestellingen, Binnengekomen documenten, Aankoopfacturen.
  - Inkoop:
    - Bestellingen: purchasing/purchase-orders.md
    - Binnengekomen documenten: purchasing/peppol-inbox.md
    - Aankoopfacturen: purchasing/purchase-invoices.md
  - Werk:
    - Projecten: work/projects.md
    - Werkorders: work/work-orders.md
    - Werkbonnen: work/work-sheets.md
    - Meerwerken: work/extra-work.md
    - Openstaande punten: work/open-points.md
    - Planning: work/planning.md
    - Medewerkers: work/staff.md
    - Ploegen: work/teams.md
  # De mobiele app (24/10/2026): Aan de slag, Vandaag, De werkbon, Laten tekenen, Het project, Taken en Mijn uren; Zonder bereik volgt. Beelden met de hand uit de simulator
  # (winkelbeelden 21/10) — de automatische beeldronde bedient de app niet.
  - Mobiele app:
    - Aan de slag: app/aan-de-slag.md
    - Vandaag: app/vandaag.md
    - De werkbon: app/werkbon.md
    - Laten tekenen: app/laten-tekenen.md
    - Het project: app/project.md
    - Taken en Mijn uren: app/taken-en-uren.md
  - Voorraad:
    - Artikelen: inventory/articles.md
    - Voorraadstand: inventory/stock-level.md
  - Platformbeheer:
    - Platformbeheer: administration/platform-management.md
    - Bedrijfsfiche: settings/company-profile.md
    - Documentsjablonen: settings/document-templates.md
    - Mailsjablonen: settings/mail-templates.md
    - Mailafzenders: settings/mail-senders.md
    - Artikelfamilies: administration/article-families.md
    - Eenheden: administration/units.md
    - Stamgegevens: administration/master-data.md
    - Productiestatus: administration/production-statuses.md
    - Projecttypes: administration/project-types.md
    - Werfvoorbereiding: administration/site-preparation.md
    - Standaardmappen: administration/default-folders.md
    - Pipeline-status: administration/pipeline-statuses.md
    - Klantcategorieën: administration/account-categories.md
    - Contactfuncties: administration/contact-functions.md
    - Aansprekingen: administration/contact-salutations.md
    - Leadbronnen: administration/lead-sources.md
    - Types aanvraag: administration/lead-request-types.md
    - Leadfases: administration/lead-status.md
    - Leadopvolging: administration/lead-follow-up.md
    - Btw-codes: administration/vat-codes.md
    - Offertestatus: administration/quote-status.md
    - Factuurstatus: administration/invoice-status.md
    - Tenants: administration/tenants.md
    - Gebruikers: administration/users.md
    - Rollen: administration/roles.md
    - App-toegang: administration/app-access.md
    - Prullenbak: administration/recycle-bin.md
    - Actielogboek: administration/audit-log.md
    - Conversie: administration/conversion.md
