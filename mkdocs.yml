site_name: Nimble Documentatie
site_description: Officiële handleiding voor Nimble
site_author: Dominique
site_url: https://docs.nimble-erp.eu/
copyright: >
  Nimble &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden. · <a href="https://www.nimble-erp.eu/">nimble-erp.eu</a>

theme:
  name: material
  # Eigen sjabloonmap: overrides/main.html zet de deelkoppen (Open Graph) op elke pagina — zie dat bestand.
  custom_dir: overrides
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js
  # Plausible Analytics — cookieloos, geen persoonsgegevens, EU-hosting; dus
  # geen toestemmingsbanner nodig. Via extra_javascript belandt dit in ELKE
  # gegenereerde pagina, ook in pagina's die er later bij komen.
  - https://plausible.io/js/pa-qZCiclZlgo91af6GNQVWW.js
  - javascripts/plausible-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…: / :octicons-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Nog-niet-geschreven pagina's worden niet gebouwd en niet geïndexeerd — zie hooks/verberg_skeletten.py
hooks:
  - hooks/verberg_skeletten.py
  # Eigen omschrijving per pagina voor zoekmachines en bij het delen — zie het bestand zelf (11/10/2026).
  - hooks/beschrijving.py
  # De films (16/10/2026): de speler bovenaan de pagina die een film uitlegt, en het overzicht op videos.md. De hook
  # woont in adm-appkit/tools/filmgenerator (gedeeld met CreditSoft) en leest tools/films-uitslag.json. Lokaal: een
  # symlink _appkit → ~/projects/adm-appkit; in de deploy checkt de workflow adm-appkit mee uit.
  - _appkit/tools/filmgenerator/films_hook.py

# Strikte bouw (vlootafspraak 10/10/2026, adm-appkit/docs/docs-site-vormgeving.md): een dode link, een dood anker of
# een pagina die niet in de nav staat, is een waarschuwing — en de uitrol bouwt met --strict, dus dan faalt de bouw in
# plaats van dat de fout online komt. Wat er ONLINE staat (beelden, externe links) meet tools/linkcheck.py.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn

plugins:
  - search:
      lang:
        - nl
        - fr
  # Klik op een schermafbeelding = schermvullend openen, met zoom en pijltjes tussen de beelden van
  # dezelfde pagina. Nodig omdat een bewerkscherm van 2880 px breed in een tekstkolom van ~830 px
  # onleesbaar klein wordt — en onze afdrukken zijn precies dat.
  #
  # ⚠️ Vóór `i18n`, en dat is geen smaak: die plugin bouwt per taal een aparte pagina, en glightbox moet
  # op elke gebouwde pagina passeren. Staat hij erna, dan krijgt de Franse kant geen vergroting.
  #
  # Overgenomen uit creditsoft-docs (26/08/2026, op vraag van Dominique) — daar draait dit al.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      # Alleen echte schermafbeeldingen, geen emoji-iconen en geen logo in de kopbalk.
      skip_classes:
        - twemoji
        - emojione
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: Nimble Documentatie
          site_description: Officiële handleiding voor Nimble
        - locale: fr
          name: Français
          build: true
          site_name: Nimble Documentation
          site_description: Manuel officiel de Nimble
          copyright: >
            Nimble &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés. · <a href="https://www.nimble-erp.eu/fr/">nimble-erp.eu</a>
          theme:
            language: fr
            palette:
              - scheme: default
                primary: white
                accent: deep purple
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: deep purple
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            Home: Accueil
            Mobiele app: Application mobile
            De werkbon: Le bon de travail
