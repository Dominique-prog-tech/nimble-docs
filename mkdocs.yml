site_name: Nimble Documentatie
site_description: Officiële handleiding voor Nimble
site_author: Dominique
site_url: https://docs.nimble-erp.eu/
copyright: >
  Nimble &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js
  # Plausible Analytics — cookieloos, geen persoonsgegevens, EU-hosting; dus
  # geen toestemmingsbanner nodig. Via extra_javascript belandt dit in ELKE
  # gegenereerde pagina, ook in pagina's die er later bij komen.
  - https://plausible.io/js/pa-qZCiclZlgo91af6GNQVWW.js
  - javascripts/plausible-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…: / :octicons-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Nog-niet-geschreven pagina's worden niet gebouwd en niet geïndexeerd — zie hooks/verberg_skeletten.py
hooks:
  - hooks/verberg_skeletten.py

plugins:
  - search:
      lang:
        - nl
        - fr
  # Klik op een schermafbeelding = schermvullend openen, met zoom en pijltjes tussen de beelden van
  # dezelfde pagina. Nodig omdat een bewerkscherm van 2880 px breed in een tekstkolom van ~830 px
  # onleesbaar klein wordt — en onze afdrukken zijn precies dat.
  #
  # ⚠️ Vóór `i18n`, en dat is geen smaak: die plugin bouwt per taal een aparte pagina, en glightbox moet
  # op elke gebouwde pagina passeren. Staat hij erna, dan krijgt de Franse kant geen vergroting.
  #
  # Overgenomen uit creditsoft-docs (26/08/2026, op vraag van Dominique) — daar draait dit al.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      # Alleen echte schermafbeeldingen, geen emoji-iconen en geen logo in de kopbalk.
      skip_classes:
        - twemoji
        - emojione
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: Nimble Documentatie
          site_description: Officiële handleiding voor Nimble
        - locale: fr
          name: Français
          build: true
          site_name: Nimble Documentation
          site_description: Manuel officiel de Nimble
          copyright: >
            Nimble &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            palette:
              - scheme: default
                primary: white
                accent: deep purple
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: deep purple
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            Home: Accueil
            Leads vanaf uw website: Les leads depuis votre site web
            Lijsten filteren: Filtrer les listes
            Werken met een fiche: Travailler avec une fiche
            Relaties: Relations
            Contactpersonen: Personnes de contact
            Contactfuncties: Fonctions de contact
            Beheer: Configuration
            Conversie: Conversion
            Platformbeheer: Administration
            Bedrijfsfiche: Fiche d'entreprise
            Documentsjablonen: Modèles de documents
            Artikelfamilies: Familles d'articles
            Eenheden: Unités de mesure
            Stamgegevens: Données de base
            Leadbronnen: Sources de leads
            Types aanvraag: Types de demande
            Leadstatus: Statut de lead
            Leadfases: Phases de lead
            Leadopvolging: Suivi des leads
            Taken: Tâches
            Bijlagen: Pièces jointes
            Notities: Notes
            Voorraad: Stock
            Artikelen: Articles
            Klantcategorieën: Catégories de clients
            Verkoop: Ventes
            Offertes: Devis
            Btw-codes: Codes TVA
            Offertestatus: Statuts de devis
            # ⚠️ Deze vijf stonden tot 26/08/2026 ONVERTAALD in de Franse navigatie. De Franse pagina's
            # zelf droegen de juiste titel (tenants.fr.md heet "Registre des clients"); alleen het menu-item
            # bleef Nederlands, want een hoofdstuk toevoegen aan nav: dwingt geen regel hier af. Gemeld door
            # de creditsoft-docs-sessie, die hetzelfde vond in haar eigen bovenbalk.
            # De Franse termen komen uit NimbleNav.cs en uit de FR-pagina's — niet uit een eigen vertaling.
            Klantenregister: Registre des clients
            Gebruikers: Utilisateurs
            Rollen: Rôles
            Prullenbak: Corbeille
            Actielogboek: Journal d'audit

extra:
  generator: false

