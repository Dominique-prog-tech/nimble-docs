site_name: Nimble Documentatie
site_description: Officiële handleiding voor Nimble
site_author: Dominique
site_url: https://docs.nimble-erp.eu/
copyright: >
  Nimble &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - nl
        - fr
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: Nimble Documentatie
          site_description: Officiële handleiding voor Nimble
        - locale: fr
          name: Français
          build: true
          site_name: Nimble Documentation
          site_description: Manuel officiel de Nimble
          copyright: >
            Nimble &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            palette:
              - scheme: default
                primary: white
                accent: deep purple
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: deep purple
                accent: deep purple
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            Home: Accueil
            Relaties: Relations
            Contactpersonen: Personnes de contact
            Contactfuncties: Fonctions de contact
            Beheer: Configuration
            Conversie: Conversion
            Platformbeheer: Administration
            Bedrijfsfiche: Fiche d'entreprise
            Artikelfamilies: Familles d'articles
            Eenheden: Unités de mesure
            Stamgegevens: Données de base
            Leadbronnen: Sources de leads
            Types aanvraag: Types de demande
            Leadstatus: Statut de lead

extra:
  generator: false

nav:
  - Home: index.md
  - CRM:
    - Leads: crm/leads.md
    - Relaties: relations.md
    - Contactpersonen: crm/contactpersonen.md
    - Taken: crm/tasks.md
  - Voorraad:
    - Artikelen: inventory/articles.md
  - Platformbeheer:
    - Platformbeheer: administration/platform-management.md
    - Bedrijfsfiche: settings/company-profile.md
    - Artikelfamilies: administration/article-families.md
    - Eenheden: administration/units.md
    - Stamgegevens: administration/master-data.md
    - Klantcategorieën: administration/account-categories.md
    - Contactfuncties: administration/contact-functions.md
    - Leadbronnen: administration/lead-sources.md
    - Types aanvraag: administration/lead-request-types.md
    - Leadstatus: administration/lead-status.md
    - Leadopvolging: administration/lead-follow-up.md
  - Beheer:
    - Conversie: administration/conversion.md
