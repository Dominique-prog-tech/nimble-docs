site_name: Nimble Documentatie
site_description: Officiële handleiding voor Nimble
site_author: Dominique
site_url: https://docs.nimble-erp.eu/
copyright: >
  Nimble &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js
  # Plausible Analytics — cookieloos, geen persoonsgegevens, EU-hosting; dus
  # geen toestemmingsbanner nodig. Via extra_javascript belandt dit in ELKE
  # gegenereerde pagina, ook in pagina's die er later bij komen.
  - https://plausible.io/js/pa-qZCiclZlgo91af6GNQVWW.js
  - javascripts/plausible-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…: / :octicons-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - nl
        - fr
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: Nimble Documentatie
          site_description: Officiële handleiding voor Nimble
        - locale: fr
          name: Français
          build: true
          site_name: Nimble Documentation
          site_description: Manuel officiel de Nimble
          copyright: >
            Nimble &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            palette:
              - scheme: default
                primary: white
                accent: deep purple
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: deep purple
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            Home: Accueil
            Leads vanaf uw website: Les leads depuis votre site web
            Lijsten filteren: Filtrer les listes
            Werken met een fiche: Travailler avec une fiche
            Relaties: Relations
            Contactpersonen: Personnes de contact
            Contactfuncties: Fonctions de contact
            Beheer: Configuration
            Conversie: Conversion
            Platformbeheer: Administration
            Bedrijfsfiche: Fiche d'entreprise
            Artikelfamilies: Familles d'articles
            Eenheden: Unités de mesure
            Stamgegevens: Données de base
            Leadbronnen: Sources de leads
            Types aanvraag: Types de demande
            Leadstatus: Statut de lead
            Leadfases: Phases de lead
            Leadopvolging: Suivi des leads
            Taken: Tâches
            Bijlagen: Pièces jointes
            Voorraad: Stock
            Artikelen: Articles
            Klantcategorieën: Catégories de clients

extra:
  generator: false

nav:
  - Home: index.md
  - Lijsten filteren: lijsten-filteren.md
  - Werken met een fiche: fiches.md
  - CRM:
    - Leads: crm/leads.md
    - Leads vanaf uw website: crm/leads-webformulier.md
    - Relaties: relations.md
    - Contactpersonen: crm/contactpersonen.md
    - Taken: crm/tasks.md
    - Bijlagen: bijlagen.md
  - Voorraad:
    - Artikelen: inventory/articles.md
  - Platformbeheer:
    - Platformbeheer: administration/platform-management.md
    - Bedrijfsfiche: settings/company-profile.md
    - Artikelfamilies: administration/article-families.md
    - Eenheden: administration/units.md
    - Stamgegevens: administration/master-data.md
    - Klantcategorieën: administration/account-categories.md
    - Contactfuncties: administration/contact-functions.md
    - Leadbronnen: administration/lead-sources.md
    - Types aanvraag: administration/lead-request-types.md
    - Leadfases: administration/lead-status.md
    - Leadopvolging: administration/lead-follow-up.md
  - Beheer:
    - Klantenregister: administration/tenants.md
    - Gebruikers: administration/users.md
    - Rollen: administration/roles.md
    - Prullenbak: administration/recycle-bin.md
    - Actielogboek: administration/audit-log.md
    - Conversie: administration/conversion.md
